<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>$MOJAK Burn Meter</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Outfit:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:'Outfit',sans-serif;display:flex;justify-content:center;padding:10px}
.burnm{width:100%;max-width:560px;background:linear-gradient(180deg,#1a0c12,#160c28);border:1px solid #ff48c433;border-radius:24px;padding:20px 22px;text-align:center;position:relative;overflow:hidden}
.burnm::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 130%,#ff48c426,transparent 60%);pointer-events:none}
.bl{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#ff48c4}
.bn{font-family:'Boogaloo',cursive;font-size:46px;line-height:1.1;margin:5px 0 2px;color:#f3ecff;letter-spacing:1px}
.bn b{color:#c6ff4d}
.bs{font-family:ui-monospace,monospace;font-size:11px;color:#9b86c9;line-height:1.5}
.bbar{height:5px;border-radius:99px;background:#2a1420;margin-top:12px;overflow:hidden}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,#ff48c4,#ffb24d);width:0;transition:width 1s}
a.cta{display:inline-block;margin-top:11px;font-family:ui-monospace,monospace;font-size:11px;color:#b985ff;text-decoration:none}
</style></head>
<body>
<div class="burnm">
  <div class="bl">🔥 $MOJAK burned · forever</div>
  <div class="bn"><b id="burnNum">—</b> MOJAK</div>
  <div class="bs" id="burnSub">reading the chain…</div>
  <div class="bbar"><i id="burnBar"></i></div>
  <a class="cta" href="https://ai.mojakcto.xyz" target="_blank">burns from Mojak AI deploys + buyback →</a>
</div>
<script>
(function(){
  var API='https://ai.mojakcto.xyz/api/burn';
  var numEl=document.getElementById('burnNum'),subEl=document.getElementById('burnSub'),barEl=document.getElementById('burnBar');
  function fmt(n){return n>=1?Math.floor(n).toLocaleString():'0';}
  function animateTo(target){var t0=performance.now(),dur=900;function step(t){var k=Math.min(1,(t-t0)/dur);var v=target*(1-Math.pow(1-k,3));numEl.textContent=fmt(v);if(k<1)requestAnimationFrame(step);else numEl.textContent=fmt(target);}requestAnimationFrame(step);}
  async function read(){try{var j=await(await fetch(API)).json();if(j.error)throw 0;
    animateTo(j.burnedTokens);
    subEl.innerHTML=(j.pct>=0.0001?j.pct.toFixed(4):'0.0000')+'% of '+Math.round(j.supplyTokens).toLocaleString()+' supply';
    barEl.style.width=Math.min(100,Math.max(j.pct,j.burnedTokens>0?2:0))+'%';
  }catch(e){subEl.textContent='reading the chain…';}}
  read();setInterval(read,30000);
})();
</script>
</body></html>
